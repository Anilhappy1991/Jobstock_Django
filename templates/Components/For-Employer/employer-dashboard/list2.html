{% for item in candidates|slice:"4:15" %}
    <div class="col-xl-12 col-lg-12 col-md-12 col-12">
        <div class="jbs-list-box border">
            <div class="jbs-list-head m-0">
                <div class="jbs-list-head-thunner">
                    <div class="jbs-list-usrs-thumb jbs-verified"><a href="{% url 'App:candidate_detail' title=item.title|slugify %}"><figure><img src="{{ item.img }}" class="img-fluid circle" alt=""></figure></a></div>
                    <div class="jbs-list-job-caption">
                        <div class="jbs-job-title-wrap"><h4><a href="{% url 'App:candidate_detail' title=item.title|slugify %}" class="jbs-job-title">{{ item.title }}</a></h4></div>
                        <div class="jbs-job-mrch-lists">
                            <div class="single-mrch-lists">
                                <span>{{ item.subtitle }}</span>.<span><i class="fa-solid fa-location-dot me-1"></i>Canada, USA</span>
                            </div>
                        </div>
                        <div class="jbs-grid-job-edrs-group mt-1">
                            <span>HTML</span>
                            <span>CSS3</span>
                            <span>Bootstrap</span>
                            <span>Redux</span>
                        </div>
                    </div>
                </div>
                <div class="jbs-list-head-middle">
                    <div class="elsocrio-jbs sm"><div class="ilop-tr"><i class="fa-solid fa-coins"></i></div><h5 class="jbs-list-pack">{{ item.years }}</h5></div>
                </div>
                <div class="jbs-list-head-last">
                    <a href="JavaScript:Void(0);" class="rounded btn-md btn-dark px-3"><i class="fa-solid fa-eye"></i></a>
                    <a href="JavaScript:Void(0);" class="rounded btn-md btn-green px-3"><i class="fa-solid fa-envelope-circle-check"></i></a>
                    <a href="JavaScript:Void(0);" class="rounded btn-md btn-red px-3"><i class="fa-solid fa-trash-can"></i></a>
                </div>
            </div>
        </div>
    </div>
{% endfor %}
