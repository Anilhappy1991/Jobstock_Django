<!-- Log In Modal -->
<div class="modal fade" id="login" tabindex="-1" role="dialog" aria-labelledby="loginmodal" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content shadow-lg border-0">
            <div class="modal-header border-0 pb-0 position-relative">
                <button type="button" class="btn-close position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" aria-label="Close"></button>
                <div class="text-center w-100">
                    <!-- Optional: Add your logo here -->
                    <!-- <div class="mb-3">
                        <img src="{% static 'app/img/ico.png' %}" class="img-fluid" width="60" alt="Logo">
                    </div> -->
                    <h3 class="modal-title fw-bold text-dark mb-1">Welcome Back</h3>
                    <p class="text-muted small">Sign in to your account to continue</p>
                </div>
            </div>
            
            <div class="modal-body pt-0">
                <!-- Messages Display -->
                {% if messages %}
                <div class="mb-4">
                    {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show rounded-3" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    {% endfor %}
                </div>
                {% endif %}
                
                <!-- Login Form -->
                <form method="post" action="{% url 'App:login' %}" class="needs-validation" novalidate>
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ request.path }}">
                    
                    <!-- Username Field -->
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username or Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0">
                                <i class="fas fa-user text-muted"></i>
                            </span>
                            <input type="text" 
                                   name="username" 
                                   id="username"
                                   class="form-control border-start-0 ps-0" 
                                   placeholder="Enter your username or email"
                                   value="{{ request.POST.username }}"
                                   required>
                        </div>
                        <div class="invalid-feedback">
                            Please enter your username or email.
                        </div>
                    </div>
                    
                    <!-- Password Field -->
                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <a href="JavaScript:Void(0);" class="text-decoration-none text-primary small">Forgot Password?</a>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0">
                                <i class="fas fa-lock text-muted"></i>
                            </span>
                            <input type="password" 
                                   name="password" 
                                   id="password"
                                   class="form-control border-start-0 ps-0" 
                                   placeholder="Enter your password"
                                   required>
                            <button class="btn btn-outline-secondary border-start-0" type="button" id="togglePassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="invalid-feedback">
                            Please enter your password.
                        </div>
                    </div>
                    
                    <!-- Remember Me Checkbox -->
                    <div class="mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label text-muted" for="rememberMe">
                                Remember me for 30 days
                            </label>
                        </div>
                    </div>
                    
                    <!-- Submit Button -->
                    <div class="d-grid gap-2 mb-4">
                        <button type="submit" class="btn btn-primary btn-lg fw-semibold py-3">
                            <i class="fas fa-sign-in-alt me-2"></i>Sign In
                        </button>
                    </div>
                </form>
                
                <!-- Divider
                <div class="text-center position-relative my-4">
                    <hr class="my-0">
                    <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 text-muted small">Or continue with</span>
                </div> -->
                
                <!-- Social Login (Optional)
                <div class="mb-4">
                    <div class="row g-2">
                        <div class="col-6">
                            <a href="JavaScript:Void(0);" class="btn btn-outline-dark w-100 d-flex align-items-center justify-content-center">
                                <i class="fab fa-google me-2"></i>Google
                            </a>
                        </div>
                        <div class="col-6">
                            <a href="JavaScript:Void(0);" class="btn btn-outline-primary w-100 d-flex align-items-center justify-content-center">
                                <i class="fab fa-facebook-f me-2"></i>Facebook
                            </a>
                        </div>
                    </div>
                </div> -->
            </div>
            
            <!-- Footer -->
            <div class="modal-footer border-0 bg-light rounded-bottom-3">
                <div class="text-center w-100">
                    <p class="mb-0 text-muted">Don't have an account?
                        <a href="{% url 'App:signup' %}" class="text-primary fw-bold text-decoration-none ms-1">
                            Create Account
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript for password toggle -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Toggle password visibility
    const togglePassword = document.querySelector('#togglePassword');
    const password = document.querySelector('#password');
    
    if (togglePassword && password) {
        togglePassword.addEventListener('click', function() {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
        });
    }
    
    // Form validation
    const forms = document.querySelectorAll('.needs-validation');
    Array.from(forms).forEach(form => {
        form.addEventListener('submit', event => {
            if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
            }
            form.classList.add('was-validated');
        }, false);
    });
});
</script>

<!-- Optional: Add CSS for better spacing and transitions -->
<style>
.modal-content {
    border-radius: 1rem;
    overflow: hidden;
}

.modal-header .btn-close {
    z-index: 1;
}

.input-group:focus-within {
    box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
    border-radius: 0.375rem;
}

.btn-primary {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: none;
    transition: transform 0.2s;
}

.btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
}

.form-control:focus {
    box-shadow: none;
    border-color: #667eea;
}

/* Smooth modal animation */
.modal.fade .modal-dialog {
    transition: transform 0.3s ease-out;
    transform: translate(0, -50px);
}

.modal.show .modal-dialog {
    transform: none;
}
</style>
<!-- End Modal -->
